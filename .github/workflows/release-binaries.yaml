name: Rolling Release Binary

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Two quick pushes must not race: the older build could finish last and
# overwrite the newer assets on the rolling release.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

# Keep in sync with docker/Dockerfile (OPENSSL_VERSION / OPENSSL_SHA256).
env:
  OPENSSL_VERSION: "3.6.4"
  OPENSSL_SHA256: "9bffaa1ad1e07b354c21bd3324ec02fa15579f45a7d0494b3e74bc449b7333ef"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Setup repo
        uses: actions/checkout@v7
        with:
          # The version constants are baked at compile time from git, so the build needs the full history.
          fetch-depth: 0

      # Compile a fully static (musl) binary using the official Crystal Alpine
      # image purely as a toolchain. This does NOT build or push a container
      # image — it only produces ./invidious and a populated ./assets/.
      - name: Build static binary
        run: |
          docker run --rm \
            -v "${PWD}":/src -w /src \
            -e OPENSSL_VERSION -e OPENSSL_SHA256 \
            84codes/crystal:1.21.0-alpine \
            sh -eu scripts/build-static.sh

      - name: Assemble release tree
        run: |
          rm -rf dist
          mkdir -p dist/config
          cp invidious dist/
          chmod +x dist/invidious
          cp -r assets dist/
          cp -r locales dist/
          cp -r config/sql dist/config/
          # Ship config.example.yml only, so an existing config/config.yml on
          # the server is never overwritten by an update.
          cp config/config.example.yml dist/config/
          cp invidious.service dist/
          tar -czf invidious-x86_64-unknown-linux-gnu.tar.gz -C dist .
          # Publish a checksum so update.sh can verify integrity before extracting.
          sha256sum invidious-x86_64-unknown-linux-gnu.tar.gz > invidious-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: invidious-x86_64-unknown-linux-gnu.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: invidious-x86_64-unknown-linux-gnu
          path: |
            invidious-x86_64-unknown-linux-gnu.tar.gz
            invidious-x86_64-unknown-linux-gnu.tar.gz.sha256
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    needs: build
    # Only publish the rolling release from master. A workflow_dispatch on
    # another branch would otherwise create an orphan release-<branch> tag that
    # update.sh (pinned to release-master) can never consume.
    if: github.ref_name == 'master'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: ncipollo/release-action@v1
        with:
          tag: release-${{ github.ref_name }}
          removeArtifacts: true
          allowUpdates: true
          artifacts: artifacts/**
          body: |
            Static Linux (x86_64, musl) Invidious binary built from the `${{ github.ref_name }}` branch.

            The tarball contains the `invidious` binary plus the runtime files it
            needs: `assets/`, `locales/`, and `config/` (config.example.yml + sql).
            Extract it over your install directory and restart the service
            (see `update.sh`). Runtime host packages are still required:
            `librsvg` (rsvg-convert), an Open Sans font, and tzdata.
